<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1800, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <title>挪车提醒 · 界面效果图</title>
</head>
<body class="overview">
<div class="overview-wrap">
  <div class="overview-head">
    <div class="overview-icon"><img src="icon.png" alt="App 图标"></div>
    <div>
      <h1>挪车提醒</h1>
      <p>v1.1.1 · 界面效果图</p>
    </div>
    <div class="overview-note">按实际布局与配色制作</div>
  </div>

  <div class="phones">
    <div class="phone-block">
      <div class="phone"><img src="home.png" alt="首页"></div>
      <div class="phone-label">
        <b>首页</b>
        <span>权限已开启时自动隐藏，只保留核心信息</span>
      </div>
    </div>

    <div class="phone-block">
      <div class="phone"><img src="vibration.png" alt="震动提醒"></div>
      <div class="phone-label">
        <b>震动提醒</b>
        <span>1 分钟未处理，全屏震动，不响铃</span>
      </div>
    </div>

    <div class="phone-block">
      <div class="phone"><img src="alarm.png" alt="全屏闹钟"></div>
      <div class="phone-label">
        <b>全屏闹钟</b>
        <span>再 1 分钟未处理，系统闹钟铃声 + 震动</span>
      </div>
    </div>
  </div>

  <div class="overview-foot">
    <span>图标 / 首页 / 震动提醒 / 全屏闹钟</span>
    <span>效果图用于确认设计，实际显示以手机系统字体与屏幕尺寸为准</span>
  </div>
</div>
</body>
</html>
