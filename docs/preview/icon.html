      box-shadow: inset 0 1px 0 rgba(255,255,255,.16);
    }
    .icon::before {

      position: absolute;
      width: 420px;
      height: 420px;
      right: -150px;
      top: -180px;
      border-radius: 50%;

      left: 153px;
      top: 153px;
      width: 206px;
      height: 206px;
    }
    .dot {

      left: 300px;
      top: 128px;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #fbbf24;
      border: 6px solid #ffffff;
      box-shadow: 0 6px 14px rgba(0,0,0,.18);
    }
    .dot::before {
      content: "";
      position: absolute;
      left: 31px;
      top: 15px;
      width: 8px;
      height: 27px;
      border-radius: 4px;
      background: #2a1506;
    }
    .dot::after {
      content: "";
      position: absolute;
      left: 31px;
      top: 47px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2a1506;
    }
